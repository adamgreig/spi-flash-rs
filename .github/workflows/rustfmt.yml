on:
  push:
    branches: [ master ]
  pull_request:

name: Code formatting check

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@stable
          components: rustfmt
      - run: cargo fmt --all -- --check
